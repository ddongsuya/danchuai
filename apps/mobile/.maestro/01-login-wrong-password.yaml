appId: kr.danchu.agent
name: 비밀번호가 틀리면 오류 문구
tags: [auth]
---
- launchApp:
    clearState: true
- tapOn: "단추 계정으로 로그인"
- tapOn: "you@company.kr"
- inputText: ${EMAIL}
# 이메일 칸의 다음(next) 키로 비밀번호 칸으로 간다
- pressKey: Enter
- inputText: "wrong-password-0000"
- tapOn: "로그인"
- assertVisible: "이메일 또는 비밀번호가 맞지 않아요."
